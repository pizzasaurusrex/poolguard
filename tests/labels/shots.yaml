shots:
  - shot: adult-exits.MP4
    source: adult-exits.MP4
    duration_seconds: 17.35
    people: 3
    mode: swim
    camera: backyard_simplisafe
    notes: "3 swimmers two in orance swim shirts. One adult exits the pool and walks away. The other two remain in the pool."

  - shot: drowning.MP4
    source: drowning.MP4
    duration_seconds: 17.02
    people: 3
    mode: swim
    camera: backyard_simplisafe
    notes: "3 swimmers one one the pool deck  and jumps in at 10 seconds. The other two remain in the pool. One of the swimmers in the pool appears to be struggling and goes under at the 15 second mark. The other two swimmers remain in the pool and appear to be unaware of the struggling swimmer."

  - shot: jump_in_relax.MP4
    source: jump_in_relax.MP4
    duration_seconds: 13.06
    people: 3
    mode: swim
    camera: backyard_simplisafe
    notes: "3 swimmers one on the pool. One in the pool and two on the edge of the pool. One swimmer jumps in off the diving board around 11 seconds. "

  - shot: jump-in.MP4
    source: jump-in.MP4
    duration_seconds: 16.45
    people: 3
    mode: swim
    camera: backyard_simplisafe
    notes: "Three swimmers. One exits and jumps in the deep end of the pool. The other two remain in the pool."

  - shot: swimmer-mostly-hidden.MP4
    source: swimmer-mostly-hidden.MP4
    duration_seconds: 21.25
    people: 3
    mode: swim
    camera: backyard_simplisafe
    notes: "Three swimmers. One on the pool deck and two in the water. One swimmer is in the bottom corner of the pool and difficult to see at the edge."

  - shot: drowning-test.mp4
    source: drowning-test.mp4
    duration_seconds: 39.87
    people: 1
    mode: swim
    camera: backyard_simplisafe_remount
    notes: "One swimmer in the pool. The swimmer appears to be struggling and goes under at the 24 second mark. The swimmer remains under water for the remainder of the clip."
    expected_events:
      - event: submersion
        onset_window: [34.0, 39.0]

  - shot: drowning-test.mp4
    source: drowning-test.mp4
    duration_seconds: 39.87
    people: 1
    mode: armed
    camera: backyard_simplisafe_remount
    notes: "The same take replayed armed. The pool is empty at the start: the swimmer stands at the edge and jumps in at about 1.4 s, so entry must fire within the PRD's 5 s. Standing on the coping raises the edge warning, not the entry; the entry fires once he is past the edge margin (measured 1.2 s). The submersion at the end is still real and still expected."
    expected_events:
      - event: person_at_edge
        onset_window: [0.0, 1.4]
      - event: unsupervised_entry
        onset_window: [0.0, 5.0]
      - event: submersion
        onset_window: [34.0, 39.0]

  - shot: armed-cover-on-night.mp4
    source: armed-cover-on-night.mp4
    duration_seconds: 60.0
    people: 0
    mode: armed
    camera: backyard_simplisafe_2026_11
    notes: "Recorded live 2026-11-13 at night (IR, greyscale), cover on, nobody present. Must stay quiet armed. The camera was re-mounted again and sits close to, but not exactly at, the original angle: Traced as backyard_simplisafe_2026_11 from the 2026-11-16 daylight take. Chair frames and a planter on the deck are boxed as people in most frames, so the zero-track check fails."

  - shot: armed-cover-on-day-walk.mp4
    source: armed-cover-on-day-walk.mp4
    duration_seconds: 240.0
    people: 1
    mode: armed
    camera: backyard_simplisafe_2026_11
    notes: "Recorded live 2026-11-16 about 9 AM, sun and glare, cover on, armed. Sean walks the deck from 0 s to about 200 s and stands at the coping: near right edge about 30 s, far edge about 60-90 s, right end about 165 s, near left edge about 180 s, then leaves along the far edge; never steps on the cover. No entry and no submersion: nobody goes in. Edge warnings are expected while he is at the coping; they fire once per track, so how many depends on how often the tracker loses him."
    expected_events:
      - event: person_at_edge
        onset_window: [0.0, 2.0]
      - event: person_at_edge
        onset_window: [55.0, 100.0]
      - event: person_at_edge
        onset_window: [160.0, 200.0]
