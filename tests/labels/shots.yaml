# Ground-truth labels for the replay regression suite.
#
# The footage is gitignored; this manifest is the committed artifact. A shot
# whose file is missing locally is skipped by the regression run, so it is safe
# to label the shots you have and let others fill in later.
#
# Shots live in clips/. These are real recordings from the backyard camera, one
# continuous take each, so there are no cut boundaries to split at. The scraped
# YouTube clips that used to be listed here were retired on 2026-10-12 as
# unrealistic (see docs/decision-log.md).
#
# Fields:
#   shot              file name under clips/
#   source            the original clip it was cut from
#   duration_seconds  ffprobe -show_entries format=duration
#   people            distinct humans visible; the tracker should converge to
#                     this many IDs, so more IDs than this is fragmentation
#   expected_event    distress | submersion | unsupervised_entry, or omit for a
#                     shot that must stay quiet (the false-alarm budget)
#   onset_window      [start, end] seconds from shot start; the event must fire
#                     inside this window. Firing late is a failure even when the
#                     verdict is right — a drowning alert at t+40s is not a save.
#                     Required whenever expected_event is set, and vice versa.
#   notes             free text; why you labeled it this way
#
# TO LABEL: each entry below has its objective fields filled in. `people` is a
# count from six sampled frames per clip, so confirm it. Then fill in `notes`,
# and for a shot that should alert add BOTH expected_event and onset_window;
# leave both off for a shot that must stay quiet.
#
# Thresholds to keep in mind when choosing an onset_window: distress needs 5 s
# of sustained struggle and submersion needs 12 s unseen, so the earliest
# possible fire is that long after the behaviour starts.

# ---------------------------------------------------------------------------
# Camera profiles. A fixed mount has stable geometry, so its water region is
# declared once here and referenced by name from each shot. Scraped footage
# has no stable geometry — every clip is a different camera — so those shots
# carry no `camera` and fall back to whatever pool_zone config supplies.
#
# water_polygon is normalized (x, y) vertices tracing the waterline. A polygon
# rather than a rect because this pool is kidney-shaped: its bounding box is
# roughly a third deck, and the deck is exactly where tree-shadow false
# positives appear at inference resolutions high enough to see a swimmer.
#
# Traced automatically on 2026-10-12 from the five backyard clips: a median
# frame (which removes swimmers), a water-colour mask, and the largest contour
# simplified to 35 vertices, then verified by overlay. It hugs the waterline, so
# the coping and deck are outside. Re-trace if the camera is moved.
# ---------------------------------------------------------------------------
cameras:
  backyard_simplisafe:
    notes: >-
      SimpliSafe outdoor cam, fixed mount, elevated wide angle over the whole
      pool and deck. 1920x1080 @ 20fps. Barrel distortion at the frame edges.
      Crop rect covers 40% of the frame, so inference skips 60% of the pixels
      that can never contain a swimmer.
    crop_margin: 0.05
    water_polygon:
      - [0.199, 0.430]
      - [0.199, 0.456]
      - [0.218, 0.501]
      - [0.247, 0.532]
