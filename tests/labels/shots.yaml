shots:
  - shot: adult-exits.MP4
    source: adult-exits.MP4
    duration_seconds: 17.35
    people: 3
    camera: backyard_simplisafe
    notes: "3 swimmers two in orance swim shirts. One adult exits the pool and walks away. The other two remain in the pool."

  - shot: drowning.MP4
    source: drowning.MP4
    duration_seconds: 17.02
    people: 3
    camera: backyard_simplisafe
    notes: "3 swimmers one one the pool deck  and jumps in at 10 seconds. The other two remain in the pool. One of the swimmers in the pool appears to be struggling and goes under at the 15 second mark. The other two swimmers remain in the pool and appear to be unaware of the struggling swimmer."

  - shot: jump_in_relax.MP4
    source: jump_in_relax.MP4
