[project]
name = "poolguard"
version = "0.1.0"
description = "AI pool drowning detection for residential pools — camera + edge inference + tiered alerting"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28.1",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
vision = [
    "opencv-python>=4.10",
    "ultralytics>=8.3",
]
labels = [
    "pyyaml>=6.0",
]
simplisafe = [
    "livekit>=1.1",
    "simplisafe-python>=2026.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
    "ruff>=0.5",
]

[project.scripts]
poolguard = "poolguard.main:main"
poolguard-alert-test = "poolguard.scripts.alert_test:main"
poolguard-benchmark = "poolguard.scripts.benchmark_fps:main"
poolguard-replay = "poolguard.scripts.replay:main"
poolguard-simplisafe-login = "poolguard.scripts.simplisafe_login:main"
poolguard-simplisafe-watch = "poolguard.scripts.simplisafe_watch:main"
poolguard-view-check = "poolguard.scripts.view_check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poolguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not regression'"
markers = [
    "regression: replays labeled footage through a real pose model (slow, opt-in)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
